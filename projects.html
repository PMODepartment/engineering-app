<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" href="assets/img/favicon.png" />
  <link rel="apple-touch-icon" href="assets/img/icon.png" />
  <script src="assets/js/theme.js?v=20260819a"></script>
  <title>Projects — Engineering App</title>
  <link rel="stylesheet" href="assets/css/dashboard.css?v=20260819a" />
</head>
<body>
  <div class="pd-app">
    <aside class="pd-sidebar" id="nav"></aside>

    <div class="pd-content">
      <div class="pd-topbar">
        <img class="pd-topbar-mark" src="assets/img/favicon.png" alt="Megawide" />
        <h1>Projects</h1>
        <div id="user-bar"></div>
      </div>

      <div class="pd-main">
        <section class="pd-proj-pane">
          <div class="pd-toolbar">
            <div class="pd-toolbar-left">
              <span class="pd-proj-count" id="proj-count"></span>
            </div>
            <div class="pd-toolbar-right">
              <!-- Group-head FILTER. Populated from `group_heads` at load — the count in
                   the "all" label is real, so an empty portfolio cannot look filtered. -->
              <select class="pd-select pd-input-sm" id="gh-filter" title="Show only one group head"></select>
              <!-- ⚠️ "Group by: Group Head" was the DEFAULT-MISSING case: groupKeyOf()
                   has always fallen through to ghIdOf(p) for any value that is not
                   'status' or 'none', and ghLabel()/countFor() were already written for
                   it — but the option was never in this list, so the grouping existed
                   with no way to reach it. It leads now, and is the default, because a
                   group head is how this portfolio is actually organised (and it is what
                   the Planners Dashboard, which owns these records, defaults to). -->
              <select class="pd-select pd-input-sm" id="group-by" title="Group projects by">
                <option value="grouphead">Group by: Group Head</option>
                <option value="status">Group by: Status</option>
                <option value="none">Group by: None</option>
              </select>
              <select class="pd-select pd-input-sm" id="sort-by" title="Sort projects by">
                <option value="name">Sort: Name</option>
                <option value="grouphead">Sort: Group Head</option>
                <option value="id">Sort: ID</option>
                <option value="finish">Sort: Forecast Finish</option>
              </select>
              <input class="pd-input pd-input-sm" id="proj-search" type="search" placeholder="Search projects…" />
              <div class="pd-viewtoggle" role="group" aria-label="View">
                <button class="pd-vt active" id="vt-list" title="List view"><span data-ico="listView" data-ico-size="16"></span></button>
                <button class="pd-vt" id="vt-cards" title="Card view"><span data-ico="gridView" data-ico-size="16"></span></button>
              </div>
            </div>
          </div>
          <div class="pd-proj-area" id="proj-area"></div>
        </section>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/config.js?v=20260819a"></script>
  <script src="assets/js/auth.js?v=20260819a"></script>
  <script src="assets/js/db.js?v=20260819a"></script>
  <script src="assets/js/ui.js?v=20260819a"></script>
  <script src="assets/js/icons.js?v=20260819a"></script>
  <script src="assets/js/perm.js?v=20260819a"></script>
  <script src="assets/js/nav.js?v=20260819a"></script>
  <script>
  (function () {
    // A project carries ONE group_head_id. There is no tree: sorting, filtering
    // and grouping by group head is the whole structure. `NONE` is a real
    // bucket, not a hidden state — an unassigned project must stay reachable.
    var NONE = '__nogh__';
    var GH = [], PROJ = [], ghById = {};
    // ⚠️ Group head is the DEFAULT grouping. A project's group head is the one real
    // organising fact this page has (status is nearly always 'active', so grouping
    // by it produced a single heading over the whole list — a heading that says
    // nothing). Matches the Planners Dashboard, which owns these records.
    var view = 'list', groupBy = 'grouphead', sortBy = 'name';
    var ghFilter = '';                 // '' = every group head; else a gh id or NONE

    // ---- landing here CLEARS the current project -----------------------------
    // This page IS the selection step, so arriving at it means "I have not
    // chosen yet". Keeping the previous selection made the shell contradict
    // itself: the sidebar advertised a project underneath Dashboard, and
    // Dashboard/the modules would open it, while the user was still standing on
    // the screen where a project is supposed to be picked.
    //
    // Runs before Nav.render so the sidebar paints "No project selected", and
    // before anything reads pd_project.
    //
    // ⚠️ EXCEPT when config.js has just adopted a ?project= hand-off from the
    // Planners Dashboard — that IS an explicit choice, made on the way in, and
    // clearing it here would silently discard it.
    if (!/[?&]project=/.test(location.search)) {
      ['pd_project', 'pd_project_name', 'pd_group_head'].forEach(function (k) {
        try { sessionStorage.removeItem(k); } catch (e) { /* private mode */ }
      });
    }

    AppAuth.requireLogin(function (user, profile) {
      UI.renderUserBar(profile);
      Nav.render(profile, 'projects');
      // Projects and group heads are SOURCED from the Planners Dashboard, never
      // authored here — see Perm.canEditProjects(). This is why an admin sees no
      // Add or Edit control on this page: the restriction is architectural, not
      // about their role. Enforced in the database by 0009.
      // Say WHERE to go instead. Without this the page just looks broken to a
      // planner who has always been able to add a project.
      if (!Perm.canEditProjects() && Perm.isPlanner(profile)) showSourceNotice();
      boot();
    });

    // A one-line explanation above the project list, shown only to people who
    // WOULD otherwise have had the Add/Edit controls (planner and up). A viewer
    // never had them, so telling them where projects come from is just noise.
    function showSourceNotice() {
      var src = Perm.PROJECT_SOURCE;
      var area = document.getElementById('proj-area');
      if (!area || document.getElementById('proj-source-note')) return;
      var n = document.createElement('div');
      n.id = 'proj-source-note';
      n.className = 'pd-card';
      n.style.cssText = 'margin-bottom:12px;padding:10px 12px;font-size:12.5px;' +
        'color:var(--pd-muted);display:flex;gap:8px;align-items:center;';
      n.innerHTML =
        '<span data-ico="bulb" data-ico-size="15"></span>' +
        '<span>Projects and group heads are maintained in the <strong>' + Fmt.esc(src.name) +
        '</strong> and synced here. To add or change one, ' +
        '<a href="' + Fmt.esc(src.url) + '" target="_blank" rel="noopener">open it there</a>.</span>';
      area.parentNode.insertBefore(n, area);
      if (window.Icons) Icons.hydrate(n);
    }

    async function boot() {
      try {
        var res = await Promise.all([PDb.getGroupHeads(), PDb.getProjects()]);
        GH = res[0]; PROJ = res[1];
      } catch (e) { UI.toast('Load failed: ' + e.message, 'error'); return; }
      GH.forEach(function (g) { ghById[g.id] = g; });
      fillGhFilter();
      render();
      wireToolbar();
    }

    // The one resolver every view uses. A project's group head is its own tag —
    // there is no ancestry to walk any more.
    function ghIdOf(p) { return p.group_head_id || NONE; }
    function ghNameOf(p) {
      var g = ghById[p.group_head_id];
      return g ? g.name : (p.group_head_id ? p.group_head_id : null);
    }
    function ghLabel(id) {
      if (id === NONE) return '— No group head —';
      var g = ghById[id]; return g ? g.name : id;
    }
    function countFor(id) {
      return PROJ.filter(function (p) { return ghIdOf(p) === id; }).length;
    }

    // ⚠️ Built from the PROJECTS, not from the group_heads table: a group head with no
    // project would offer a filter that can only ever return nothing, and the counts
    // beside each name are what make the list worth reading. The "no group head"
    // bucket is included only when something is actually in it.
    function fillGhFilter() {
      var el = document.getElementById('gh-filter');
      if (!el) return;
      var used = {};
      PROJ.forEach(function (p) { used[ghIdOf(p)] = true; });
      var ids = GH.map(function (g) { return g.id; }).filter(function (id) { return used[id]; });
      if (used[NONE]) ids.push(NONE);
      el.innerHTML = '<option value="">All group heads (' + ids.length + ')</option>' +
        ids.map(function (id) {
          return '<option value="' + Fmt.esc(id) + '">' + Fmt.esc(ghLabel(id)) +
            ' (' + countFor(id) + ')</option>';
        }).join('');
      el.value = ghFilter;
    }

    // ---- Projects in scope + search + sort ----
    function projectsInScope() {
      var q = (document.getElementById('proj-search').value || '').toLowerCase();
      var list = PROJ.slice();
      // ⚠️ The group-head filter is applied BEFORE the search, and it compares through
      // ghIdOf() so the "no group head" bucket is selectable like any other — an
      // unassigned project must stay reachable, not become unfilterable.
      if (ghFilter) list = list.filter(function (p) { return ghIdOf(p) === ghFilter; });
      if (q) list = list.filter(function (p) {
        return (p.name || '').toLowerCase().indexOf(q) !== -1 || (p.id || '').toLowerCase().indexOf(q) !== -1;
      });
      return sortList(list);
    }

    function sortList(list) {
      // Blanks sort last in every mode — an empty finish date is unknown, not earliest.
      var cmp = {
        name: function (a, b) { return String(a.name || a.id).localeCompare(String(b.name || b.id)); },
        id: function (a, b) { return String(a.id).localeCompare(String(b.id)); },
        grouphead: function (a, b) {
          var x = ghNameOf(a), y = ghNameOf(b);
          if (!x && !y) return cmp.name(a, b);
          if (!x) return 1; if (!y) return -1;
          return x.localeCompare(y) || cmp.name(a, b);
        },
        finish: function (a, b) {
          var x = a.forecast_finish || a.end_date || '', y = b.forecast_finish || b.end_date || '';
          if (!x && !y) return cmp.name(a, b);
          if (!x) return 1; if (!y) return -1;
          return String(x).localeCompare(String(y));
        },
      }[sortBy] || cmp.name;
      return list.sort(cmp);
    }

    function statusPill(st) {
      st = (st || 'active').toLowerCase();
      var cls = st === 'archived' ? 'pd-pill-muted' : 'pd-pill-ok';
      return '<span class="pd-pill ' + cls + '">' + Fmt.esc(st.charAt(0).toUpperCase() + st.slice(1)) + '</span>';
    }

    function render() {
      var list = projectsInScope();
      document.getElementById('proj-count').textContent = list.length + (list.length === 1 ? ' project' : ' projects');
      var area = document.getElementById('proj-area');
      if (!list.length) {
        area.innerHTML = '<div class="pd-empty">No projects.</div>';
        return;
      }
      view === 'cards' ? renderCards(area, list) : renderList(area, list);
      area.querySelectorAll('[data-open]').forEach(function (el) {
        el.onclick = function () { openProject(el.dataset.open); };
      });
    }

    // Grouping key + label share one function per mode so a group's header can
    // never disagree with the rows filed under it.
    function groupKeyOf(p) {
      if (groupBy === 'status') return (p.status || 'active').toLowerCase();
      if (groupBy === 'none') return '__all__';
      return ghIdOf(p);
    }
    function groupLabelOf(k) {
      if (groupBy === 'status') return k.charAt(0).toUpperCase() + k.slice(1);
      if (groupBy === 'none') return 'All Projects';
      return ghLabel(k);
    }

    // Ordered [key, items] pairs. Shared by the list AND card views — the card
    // view used to ignore grouping entirely and render one flat run of cards,
    // silently discarding the Group-by selection the user had just made.
    function groupProjects(list) {
      var groups = {}, order = [];
      list.forEach(function (p) {
        var k = groupKeyOf(p);
        if (!groups[k]) { groups[k] = []; order.push(k); }
        groups[k].push(p);
      });
      // The unassigned bucket always sits last.
      // ⚠️ WHEN GROUPING BY GROUP HEAD, THE ORDER IS `group_heads.sort_order`, not
      // alphabetical. That column exists because the Planners Dashboard — which owns
      // these records — lets someone arrange the group heads deliberately, and db.js
      // already fetches GH ordered by it. Re-sorting alphabetically here would quietly
      // throw that arrangement away and make the two apps disagree about the order of
      // the same list. Every other grouping mode has no such intent to honour, so it
      // still reads alphabetically.
      var ghRank = {};
      GH.forEach(function (g, i) { ghRank[g.id] = i; });
      order.sort(function (a, b) {
        if (a === NONE) return 1; if (b === NONE) return -1;
        if (groupBy === 'grouphead') {
          var ra = ghRank[a], rb = ghRank[b];
          // A project tagged with a group head this app has not synced yet sorts
          // after the known ones rather than jumping to the front on an undefined.
          if (ra == null && rb == null) return groupLabelOf(a).localeCompare(groupLabelOf(b));
          if (ra == null) return 1;
          if (rb == null) return -1;
          if (ra !== rb) return ra - rb;
        }
        return groupLabelOf(a).localeCompare(groupLabelOf(b));
      });
      return order.map(function (k) { return [k, groups[k]]; });
    }

    function renderList(area, list) {
      var rows = '<table class="pd-table pd-proj-table"><thead><tr>' +
        '<th>Name</th><th>ID</th><th>Status</th><th>Group Head</th><th>Forecast Start</th><th>Forecast Finish</th>' +
        '</tr></thead><tbody>';
      groupProjects(list).forEach(function (g) {
        if (groupBy !== 'none') {
          rows += '<tr class="pd-group-row"><td colspan="6">' + Fmt.esc(groupLabelOf(g[0])) +
            ' <span class="pd-count-chip">' + g[1].length + '</span></td></tr>';
        }
        g[1].forEach(function (p) {
          rows += '<tr class="pd-proj-row" data-open="' + Fmt.esc(p.id) + '">' +
            '<td class="pd-proj-name"><span class="pd-proj-ic">' + Icons.svg('project', 16) + '</span>' + Fmt.esc(p.name) + '</td>' +
            '<td><code>' + Fmt.esc(p.id) + '</code></td>' +
            '<td>' + statusPill(p.status) + '</td>' +
            '<td>' + Fmt.esc(ghNameOf(p) || '—') + '</td>' +
            '<td>' + Fmt.date(p.forecast_start || p.start_date) + '</td>' +
            '<td>' + Fmt.date(p.forecast_finish || p.end_date) + '</td>' +
          '</tr>';
        });
      });
      rows += '</tbody></table>';
      area.innerHTML = rows;
    }

    function cardHTML(p) {
      return '<div class="pd-proj-card" data-open="' + Fmt.esc(p.id) + '">' +
        '<div class="pd-proj-card-top"><span class="pd-proj-ic">' + Icons.svg('project', 22) + '</span>' + statusPill(p.status) + '</div>' +
        '<div class="pd-proj-card-title">' + Fmt.esc(p.name) + '</div>' +
        '<div class="pd-proj-card-id"><code>' + Fmt.esc(p.id) + '</code></div>' +
        '<div class="pd-proj-card-meta">' +
          '<div><span>Group Head</span><b>' + Fmt.esc(ghNameOf(p) || '—') + '</b></div>' +
          '<div><span>Forecast Finish</span><b>' + Fmt.date(p.forecast_finish || p.end_date) + '</b></div>' +
        '</div>' +
        (p.location ? '<div class="pd-proj-card-loc">' + Icons.svg('mapPin', 13) + '<span>' + Fmt.esc(p.location) + '</span></div>' : '') +
      '</div>';
    }
    // Cards honour the SAME grouping as the list view (see groupProjects).
    function renderCards(area, list) {
      area.innerHTML = groupProjects(list).map(function (g) {
        var head = (groupBy === 'none') ? '' :
          '<div class="pd-cardgroup"><span>' + Fmt.esc(groupLabelOf(g[0])) + '</span>' +
          '<span class="pd-cardgroup-count">' + g[1].length + '</span><span class="pd-cardgroup-rule"></span></div>';
        return head + '<div class="pd-proj-cards">' + g[1].map(cardHTML).join('') + '</div>';
      }).join('');
    }

    function openProject(id) {
      var p = PROJ.find(function (x) { return x.id === id; });
      if (!p) return;
      sessionStorage.setItem('pd_project', p.id);
      sessionStorage.setItem('pd_project_name', p.name || p.id);
      sessionStorage.setItem('pd_group_head', p.group_head_id || '');
      location.href = 'dashboard.html';
    }

    // ---- Toolbar wiring ----
    function wireToolbar() {
      // ⚠️ 'input' alone is not enough: the native clear (×) and Esc fire 'search'
      // and 'change' but NOT 'input', which left the list filtered after clearing.
      bindSearch(document.getElementById('proj-search'), render);
      document.getElementById('gh-filter').onchange = function () { ghFilter = this.value; render(); };
      document.getElementById('group-by').onchange = function () { groupBy = this.value; render(); };
      document.getElementById('sort-by').onchange = function () { sortBy = this.value; render(); };
      document.getElementById('vt-list').onclick = function () { view = 'list'; setVt(); render(); };
      document.getElementById('vt-cards').onclick = function () { view = 'cards'; setVt(); render(); };
    }
    function bindSearch(el, fn) {
      if (!el) return;
      ['input', 'search', 'change'].forEach(function (ev) { el.addEventListener(ev, fn); });
    }

    function setVt() {
      document.getElementById('vt-list').classList.toggle('active', view === 'list');
      document.getElementById('vt-cards').classList.toggle('active', view === 'cards');
    }
  })();
  </script>
</body>
</html>
