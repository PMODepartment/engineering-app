<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" href="assets/img/favicon.png" />
  <link rel="apple-touch-icon" href="assets/img/icon.png" />
  <script src="assets/js/theme.js?v=20260813d"></script>
  <title>Sign in · Engineering App</title>
  <link rel="stylesheet" href="assets/css/dashboard.css?v=20260813d" />
</head>
<body>
  <div class="pd-auth-wrap">
    <div class="pd-auth-card">
      <div class="pd-auth-logo">
        <img class="pd-auth-mark" src="assets/img/favicon.png" alt="Megawide">
        <div class="pd-brand">Engineering App</div>
        <small>Megawide Construction Corporation</small>
      </div>
      <div class="pd-card">
        <form id="login-form">
          <div class="pd-field">
            <label for="email">Email</label>
            <input class="pd-input" type="email" id="email" required autocomplete="email" />
          </div>
          <div class="pd-field">
            <label for="password">Password</label>
            <input class="pd-input" type="password" id="password" required autocomplete="current-password" />
          </div>
          <button class="pd-btn pd-btn-primary" type="submit" style="width:100%;justify-content:center;">Sign in</button>
          <p id="msg" style="color:var(--pd-bad);font-size:13px;margin:12px 0 0;"></p>
        </form>
        <div style="display:flex;align-items:center;gap:10px;margin:16px 0;color:var(--pd-muted);font-size:12px;">
          <span style="flex:1;height:1px;background:var(--pd-line);"></span>
          <span>OR</span>
          <span style="flex:1;height:1px;background:var(--pd-line);"></span>
        </div>
        <button class="pd-btn" id="ms-login" type="button" style="width:100%;justify-content:center;background:#fff;border:1px solid var(--pd-line);color:#231F20;">
          <svg width="18" height="18" viewBox="0 0 21 21" aria-hidden="true"><rect x="1" y="1" width="9" height="9" fill="#f25022"/><rect x="11" y="1" width="9" height="9" fill="#7fba00"/><rect x="1" y="11" width="9" height="9" fill="#00a4ef"/><rect x="11" y="11" width="9" height="9" fill="#ffb900"/></svg>
          Sign in with Microsoft
        </button>
        <p id="ms-msg" style="color:var(--pd-bad);font-size:13px;margin:10px 0 0;"></p>
        <p style="text-align:center;margin:14px 0 0;font-size:13px;">
          <a href="forgot-password.html">Forgot password?</a>
        </p>
        <p style="text-align:center;margin:8px 0 0;font-size:13px;color:var(--pd-muted);">
          No account? <a href="register.html">Request access</a>
        </p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/config.js?v=20260813d"></script>
  <script src="assets/js/auth.js?v=20260813d"></script>
  <script src="assets/js/db.js?v=20260813d"></script>
  <script>
    // If already signed in, skip straight to the project selector.
    AppAuth.getSB().auth.getSession().then(function (r) {
      if (r.data.session) location.href = 'projects.html';
    });

    document.getElementById('login-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      var msg = document.getElementById('msg');
      msg.textContent = '';
      var email = document.getElementById('email').value.trim();
      var pw = document.getElementById('password').value;
      var { data, error } = await AppAuth.login(email, pw);
      if (error) { msg.textContent = error.message; return; }
      if (data && data.user) { try { PDb.updateLastLogin(data.user.id); } catch (e) {} }
      location.href = 'projects.html';
    });

    document.getElementById('ms-login').addEventListener('click', async function () {
      var msg = document.getElementById('ms-msg');
      msg.textContent = '';
      var { error } = await AppAuth.loginWithMicrosoft();
      // On success the browser navigates away to Microsoft immediately —
      // this only returns if the redirect itself failed (e.g. provider not
      // enabled in Supabase yet).
      if (error) msg.textContent = error.message;
    });
  </script>
</body>
</html>
