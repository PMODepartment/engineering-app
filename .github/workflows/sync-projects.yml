# =============================================================================
# Sync projects + group heads: Planners Dashboard → Engineering App
# -----------------------------------------------------------------------------
# The Planners Dashboard is the single place projects and group heads are created
# and maintained (enforced by migrations/0009-projects-read-only.sql). The two
# apps are on separate Supabase projects, so nothing propagates on its own —
# this job is what makes a new project appear in the Engineering App.
#
# It runs migrations/migrate-data.mjs from this repo, unchanged: the same script
# used for the original import, so there is no second implementation to keep
# correct.
#
# ⚠️⚠️ NEVER REMOVE `--only=group_heads,projects` ⚠️⚠️
# Without it the script also copies drawing_register and material_submittal FROM
# the Planners Dashboard — overwriting the Engineering App's live register with a
# stale pre-cutover snapshot and destroying every change made since. The
# Engineering App owns the engineering data; the Planners Dashboard owns projects
# and group heads. This flag is the entire boundary between those two facts.
#
# ⚠️ WHAT THIS SYNC DOES NOT DO
#   • It never DELETES. A project deleted in the Planners Dashboard stays here.
#     Archive instead of deleting — `status` is an ordinary column and does come
#     across.
#   • It OVERWRITES. Any local edit to a project/group-head row is replaced. That
#     is safe only because 0009 makes these tables read-only in this app; if 0009
#     is ever rolled back, this job silently becomes destructive.
#   • It does not sync USER↔PROJECT ASSIGNMENTS. Those live in users.projects and
#     are Engineering-App-specific (separate auth tables).
# =============================================================================

name: Sync projects from Planners Dashboard (fallback)

# =============================================================================
# ⚠️ SUPERSEDED by the `sync-projects` Edge Function (supabase/functions/
# sync-projects/index.ts), which the app calls from Admin → Projects → "Sync
# now", and which the Supabase dashboard runs on a schedule.
#
# KEPT as a manual fallback: if the function is broken or its secrets are wrong,
# this still works and is a known-good path back to a synced state. It does NOT
# prune — a project deleted upstream stays here — so prefer the in-app button.
#
# ⚠️ The nightly `schedule:` trigger was REMOVED so the two mechanisms cannot
# both run. Do not re-add it without removing the Supabase schedule first;
# two concurrent syncs would race on the same upserts.
# =============================================================================

on:
  # Manual "sync now", with an optional dry run. Use dry_run the first time, to
  # confirm the secrets work before anything is written.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (report only, write nothing)'
        type: boolean
        default: false

# Never let two syncs overlap — they would race on the same upserts.
concurrency:
  group: sync-projects
  cancel-in-progress: false

permissions:
  contents: read          # the job only reads this repo; it needs nothing else

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the sync script
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # ⚠️ MUST be 22 or newer. supabase-js v2 builds a realtime client inside
          # createClient(), which needs a native global WebSocket — added in Node
          # 22. On Node 20 the script dies before it does anything at all:
          #   Error: Node.js 20 detected without native WebSocket support
          # (Pinning '20' here is how this workflow failed on its first run. It
          # worked locally only because that machine runs Node 24.)
          node-version: '24'

      # This repo deliberately has NO package.json (no build step, by design), and
      # `npm i -g` does not work for ESM — Node will not resolve imports from the
      # global root. So: a throwaway workspace with its own node_modules, and the
      # script copied in, so resolution walks up from the script's own directory.
      - name: Install the Supabase client
        run: |
          mkdir -p /tmp/sync && cd /tmp/sync
          npm init -y >/dev/null
          npm pkg set type=module >/dev/null
          npm install @supabase/supabase-js --no-fund --no-audit --loglevel=error
          cp "$GITHUB_WORKSPACE/migrations/migrate-data.mjs" .

      # Fails fast and tells you WHICH side is misconfigured, without ever
      # printing key material. Cheaper than discovering it mid-write.
      - name: Preflight both connections
        working-directory: /tmp/sync
        env:
          # ⚠️ URLs are VARIABLES, not secrets. Storing them as secrets got them
          # masked as *** in the log, which hid the actual fault: preflight
          # reported "fetch failed" on the source and there was no way to see that
          # its URL was wrong. A project URL is not sensitive — the publishable key
          # already ships in assets/js/config.js. Keep only the KEYS secret.
          SRC_URL: ${{ vars.SRC_URL }}
          SRC_SERVICE_KEY: ${{ secrets.SRC_SERVICE_KEY }}
          DST_URL: ${{ vars.DST_URL }}
          DST_SERVICE_KEY: ${{ secrets.DST_SERVICE_KEY }}
        run: node migrate-data.mjs --preflight

      - name: Sync group heads + projects
        working-directory: /tmp/sync
        env:
          # ⚠️ URLs are VARIABLES, not secrets. Storing them as secrets got them
          # masked as *** in the log, which hid the actual fault: preflight
          # reported "fetch failed" on the source and there was no way to see that
          # its URL was wrong. A project URL is not sensitive — the publishable key
          # already ships in assets/js/config.js. Keep only the KEYS secret.
          SRC_URL: ${{ vars.SRC_URL }}
          SRC_SERVICE_KEY: ${{ secrets.SRC_SERVICE_KEY }}
          DST_URL: ${{ vars.DST_URL }}
          DST_SERVICE_KEY: ${{ secrets.DST_SERVICE_KEY }}
        run: |
          # See the banner at the top of this file before touching --only.
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            node migrate-data.mjs --only=group_heads,projects --dry-run
          else
            node migrate-data.mjs --only=group_heads,projects
          fi

      # migrate-data.mjs sets a non-zero exit code on failure, so a failed sync
      # fails the job and GitHub emails the repo admins. Without this note someone
      # will eventually "fix" the script to swallow errors.
      # ⚠️ Do NOT assert a cause here. The first version of this step confidently
      # blamed an expired key, when the actual failure was a Node version too old
      # for supabase-js — sending the reader looking in the wrong place. Point at
      # the real log instead and list possibilities without ranking them.
      - name: Result
        if: failure()
        run: |
          echo "::error::Project sync FAILED — new projects in the Planners Dashboard"
          echo "::error::will NOT appear in the Engineering App until this succeeds."
          echo "::error::Read the failing step's own output above; common causes are a"
          echo "::error::rotated sb_secret_ key, a missing repo secret, or a Supabase"
          echo "::error::outage. Re-run with 'Dry run' ticked to test safely."
          exit 1
